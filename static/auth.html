<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }} · Invy</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/"><span class="brand-icon" aria-hidden="true">▦</span> Invy</a></header><main class="auth-page"><h1>{{ title }}</h1>{% if message %}<p role="status">{{ message }}</p>{% endif %}{% if admin %}<form method="post" action="/admin"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="password">Admin password</label><input type="password" name="password" id="password" autocomplete="current-password" required autofocus><button class="primary" type="submit">Sign in</button></form>{% endif %}{% if sign_in %}<a href="/auth/login">Sign in</a>{% endif %}</main></body></html>
