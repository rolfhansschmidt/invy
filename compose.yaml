name: invy
services:
  invy:
    build: .
    image: invy:local
    user: "${INVY_UID:-1000}:${INVY_GID:-1000}"
    ports:
      - "${INVY_BIND_ADDRESS:-127.0.0.1}:${INVY_PORT:-8102}:8000"
    volumes:
      - ./data:/data
    environment:
      PUBLIC_URL: "${PUBLIC_URL:-http://localhost:8102}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set a long ADMIN_PASSWORD in .env}"
      SESSION_SECRET: "${SESSION_SECRET:?Set a random SESSION_SECRET in .env}"
      SESSION_HOURS: "${SESSION_HOURS:-8}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      ADMIN_LOGIN_ATTEMPTS: "${ADMIN_LOGIN_ATTEMPTS:-5}"
      ADMIN_LOGIN_WINDOW: "${ADMIN_LOGIN_WINDOW:-900}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-}"
      OIDC_DISCOVERY_URL: "${OIDC_DISCOVERY_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_SCOPES: "${OIDC_SCOPES:-openid profile email}"
      OIDC_USERNAME_CLAIM: "${OIDC_USERNAME_CLAIM:-preferred_username}"
      OIDC_GROUPS_CLAIM: "${OIDC_GROUPS_CLAIM:-groups}"
      OIDC_ALLOWED_GROUPS: "${OIDC_ALLOWED_GROUPS:-}"
      OIDC_TOKEN_AUTH_METHOD: "${OIDC_TOKEN_AUTH_METHOD:-client_secret_basic}"
    mem_limit: "${INVY_MEMORY_LIMIT:-512m}"
    cpus: "${INVY_CPUS:-1.0}"
    pids_limit: ${INVY_PIDS_LIMIT:-128}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
